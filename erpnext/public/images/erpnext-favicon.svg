<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded blue background -->
  <rect width="100" height="100" rx="16" fill="url(#bgGrad)"/>

  <!-- Outer D shape (white) -->
  <path d="M22,20 H45 A30,30 0 0 1 45,80 H22 Z" fill="white"/>

  <!-- Inner D cutout (blue, same as bg) -->
  <path d="M33,33 H46 A17,17 0 0 1 46,67 H33 Z" fill="url(#bgGrad)"/>

  <!-- Bars inside D counter -->
  <rect x="36" y="53" width="5" height="11" rx="1" fill="white" opacity="0.9"/>
  <rect x="43" y="46" width="5" height="18" rx="1" fill="white" opacity="0.7"/>
  <rect x="50" y="40" width="5" height="24" rx="1" fill="white" opacity="0.5"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1B6E"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
</svg>
